<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>RODAL3D · Potree</title>
  <link rel="stylesheet" type="text/css" href="./libs/potree/potree.css">
  <link rel="stylesheet" type="text/css" href="./libs/jquery-ui/jquery-ui.min.css">
  <link rel="stylesheet" type="text/css" href="./libs/openlayers3/ol.css">
  <link rel="stylesheet" type="text/css" href="./libs/spectrum/spectrum.css">
  <link rel="stylesheet" type="text/css" href="./libs/jstree/themes/mixed/style.css">
  <style>
    html, body { margin: 0; height: 100%; background: #111; }
    body.no-gui #potree_sidebar_container,
    body.no-gui .potree_menu_toggle,
    body.no-gui #potree_quick_buttons,
    body.no-gui #potree_description,
    body.no-gui #potree_map_toggle,
    body.no-gui .compass {
      display: none !important;
    }
    .hud {
      position: absolute;
      z-index: 20;
      pointer-events: none;
      font-family: ui-monospace, "IBM Plex Mono", "SFMono-Regular", Menlo, monospace;
      color: #ddd;
    }
    .hud button, .hud input, .hud label {
      pointer-events: auto;
    }
    .hud-top {
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .hud-panel {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: rgba(10, 10, 12, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 10px;
    }
    .hud-label {
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #aaa;
      white-space: nowrap;
    }
    .hud-value {
      font-size: 11px;
      color: #e0b56a;
      min-width: 2.6rem;
    }
    .hud-btn {
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 0.04em;
      padding: 5px 10px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 999px;
      background: rgba(10, 10, 12, 0.72);
      color: #ddd;
      cursor: pointer;
    }
    .hud-btn.active {
      border-color: #e0b56a;
      color: #e0b56a;
    }
    .hud-view {
      width: 34px;
      height: 34px;
      padding: 4px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hud-view svg {
      width: 22px;
      height: 22px;
      display: block;
    }
    .hud-view .face {
      fill: #3d3d44;
      stroke: #8a8a92;
      stroke-width: 0.7;
      stroke-linejoin: round;
    }
    .hud-view .face.lit {
      fill: #c8c8ce;
    }
    .hud-view.active {
      border-color: #e0b56a;
    }
    .hud-view.active .face.lit {
      fill: #e0b56a;
      stroke: #f0c98a;
    }
    .hud-slider {
      width: 120px;
      accent-color: #e0b56a;
    }
    .hud-slider.budget {
      width: 160px;
    }
    .hud-views {
      margin-left: auto;
      gap: 6px;
      padding: 4px 6px;
    }
    .hud-zoom-panel {
      gap: 6px;
      padding: 4px 6px;
    }
    .hud-zoom {
      font-size: 18px;
      font-weight: 500;
      line-height: 1;
      color: #ddd;
    }
  </style>
</head>
<body>
  <script src="./libs/jquery/jquery-3.1.1.min.js"></script>
  <script src="./libs/spectrum/spectrum.js"></script>
  <script src="./libs/jquery-ui/jquery-ui.min.js"></script>
  <script src="./libs/other/BinaryHeap.js"></script>
  <script src="./libs/tween/tween.min.js"></script>
  <script src="./libs/d3/d3.js"></script>
  <script src="./libs/proj4/proj4.js"></script>
  <script src="./libs/openlayers3/ol.js"></script>
  <script src="./libs/i18next/i18next.js"></script>
  <script src="./libs/jstree/jstree.js"></script>
  <script src="./libs/potree/potree.js"></script>
  <script src="./libs/plasio/js/laslaz.js"></script>

  <div class="potree_container" style="position:absolute;width:100%;height:100%;left:0;top:0;">
    <div id="potree_render_area"></div>
    <div id="potree_sidebar_container"></div>
  </div>

  <div class="hud hud-top">
    <div class="hud-panel">
      <span class="hud-label">point</span>
      <button type="button" class="hud-btn active" data-shape="square">Square</button>
      <button type="button" class="hud-btn" data-shape="circle">Circle</button>
    </div>
    <div class="hud-panel">
      <span class="hud-label">budget</span>
      <input id="budget" class="hud-slider budget" type="range" min="1000000" max="50000000" step="1000000" value="5000000">
      <span id="budget-val" class="hud-value">5M</span>
    </div>
    <div class="hud-panel">
      <span class="hud-label">size</span>
      <input id="psize" class="hud-slider" type="range" min="0.10" max="2.00" step="0.05" value="0.65">
      <span id="psize-val" class="hud-value">0.65</span>
    </div>
    <div class="hud-panel hud-views">
      <button type="button" class="hud-btn hud-view" data-view="top" title="Top" aria-label="Top view">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path class="face" d="M12 13 L21 8 L21 17 L12 22 Z"/>
          <path class="face" d="M12 13 L3 8 L3 17 L12 22 Z"/>
          <path class="face lit" d="M12 3 L21 8 L12 13 L3 8 Z"/>
        </svg>
      </button>
      <button type="button" class="hud-btn hud-view" data-view="bottom" title="Bottom" aria-label="Bottom view">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path class="face" d="M12 11 L21 16 L21 7 L12 2 Z"/>
          <path class="face" d="M12 11 L3 16 L3 7 L12 2 Z"/>
          <path class="face lit" d="M12 11 L21 16 L12 21 L3 16 Z"/>
        </svg>
      </button>
      <button type="button" class="hud-btn hud-view" data-view="side" title="Side" aria-label="Side view">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path class="face" d="M12 3 L21 8 L12 13 L3 8 Z"/>
          <path class="face" d="M12 13 L3 8 L3 17 L12 22 Z"/>
          <path class="face lit" d="M12 13 L21 8 L21 17 L12 22 Z"/>
        </svg>
      </button>
      <button type="button" class="hud-btn hud-view" data-view="iso" title="45°" aria-label="45 degree view">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path class="face" d="M12 13 L3 8 L3 17 L12 22 Z"/>
          <path class="face lit" d="M12 13 L21 8 L21 17 L12 22 Z"/>
          <path class="face lit" d="M12 3 L21 8 L12 13 L3 8 Z"/>
        </svg>
      </button>
    </div>
    <div class="hud-panel hud-zoom-panel">
      <button type="button" class="hud-btn hud-view hud-zoom" data-zoom="in" title="Zoom in" aria-label="Zoom in">+</button>
      <button type="button" class="hud-btn hud-view hud-zoom" data-zoom="out" title="Zoom out" aria-label="Zoom out">−</button>
    </div>
  </div>

  <script>
    const UTM18S =
      "+proj=utm +zone=18 +south +datum=WGS84 +units=m +no_defs";
    proj4.defs("EPSG:32718", UTM18S);
    proj4.defs("epsg:32718", UTM18S);

    const params = new URLSearchParams(window.location.search);
    const metadataUrl = params.get("metadata");
    const title = params.get("title") || "point cloud";
    const showGui = params.get("gui") === "1";

    if (!showGui) document.body.classList.add("no-gui");

    window.viewer = new Potree.Viewer(document.getElementById("potree_render_area"));
    viewer.setEDLEnabled(true);
    viewer.setFOV(60);
    viewer.loadSettingsFromURL();
    viewer.setPointBudget(5_000_000);
    viewer.setMinNodeSize(0);
    viewer.setBackground("gradient");
    viewer.setDescription(showGui ? title : "");

    const DEFAULT_SIZE = 0.65;
    let pointSize = DEFAULT_SIZE;
    let pointShape = Potree.PointShape.SQUARE;

    function applyMaterial() {
      for (const pc of viewer.scene.pointclouds) {
        pc.material.size = pointSize;
        pc.material.shape = pointShape;
        pc.material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
      }
    }

    function setActive(selector, el) {
      document.querySelectorAll(selector).forEach((b) => b.classList.remove("active"));
      el.classList.add("active");
    }

    document.querySelectorAll("[data-view]").forEach((btn) => {
      btn.addEventListener("click", () => {
        setActive("[data-view]", btn);
        const view = btn.dataset.view;
        if (view === "top") viewer.setTopView();
        else if (view === "bottom") viewer.setBottomView();
        else if (view === "side") viewer.setFrontView();
        else if (view === "iso") {
          viewer.scene.view.yaw = Math.PI / 4;
          viewer.scene.view.pitch = -Math.PI / 4;
          viewer.fitToScreen();
        }
      });
    });

    document.querySelectorAll("[data-zoom]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const view = viewer.scene.view;
        const pivot = view.getPivot();
        const factor = btn.dataset.zoom === "in" ? 0.7 : 1.4;
        const radius = Math.max(0.4, view.radius * factor);
        const offset = view.direction.clone().multiplyScalar(-radius);
        view.radius = radius;
        view.position.copy(pivot.add(offset));
        if (viewer.setMoveSpeed) viewer.setMoveSpeed(radius);
      });
    });

    document.querySelectorAll("[data-shape]").forEach((btn) => {
      btn.addEventListener("click", () => {
        setActive("[data-shape]", btn);
        pointShape = btn.dataset.shape === "circle"
          ? Potree.PointShape.CIRCLE
          : Potree.PointShape.SQUARE;
        applyMaterial();
      });
    });

    const budgetEl = document.getElementById("budget");
    const budgetVal = document.getElementById("budget-val");
    budgetEl.addEventListener("input", () => {
      const n = Number(budgetEl.value);
      viewer.setPointBudget(n);
      budgetVal.textContent = `${Math.round(n / 1e6)}M`;
    });

    const sizeEl = document.getElementById("psize");
    const sizeVal = document.getElementById("psize-val");
    sizeEl.addEventListener("input", () => {
      pointSize = Number(sizeEl.value);
      sizeVal.textContent = pointSize.toFixed(2);
      applyMaterial();
    });

    if (showGui) {
      viewer.loadGUI(() => {
        viewer.setLanguage("en");
        $("#menu_appearance").next().show();
        $("#menu_tools").next().show();
        viewer.toggleSidebar();
      });
    }

    if (!metadataUrl) {
      viewer.setDescription("Missing ?metadata= URL");
    } else {
      Potree.loadPointCloud(metadataUrl, title).then((e) => {
        const pointcloud = e.pointcloud;
        const material = pointcloud.material;
        material.size = pointSize;
        material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
        material.shape = pointShape;
        material.activeAttributeName = "elevation";
        viewer.scene.addPointCloud(pointcloud);
        viewer.fitToScreen();
      }).catch((err) => {
        console.error("Failed to load point cloud", err);
        viewer.setDescription("Failed to load point cloud");
      });
    }
  </script>
</body>
</html>
