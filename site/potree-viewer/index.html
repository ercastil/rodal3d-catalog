<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>RODAL3D · Potree</title>
  <link rel="stylesheet" type="text/css" href="./libs/potree/potree.css">
  <link rel="stylesheet" type="text/css" href="./libs/jquery-ui/jquery-ui.min.css">
  <link rel="stylesheet" type="text/css" href="./libs/openlayers3/ol.css">
  <link rel="stylesheet" type="text/css" href="./libs/spectrum/spectrum.css">
  <link rel="stylesheet" type="text/css" href="./libs/jstree/themes/mixed/style.css">
  <style>
    html, body { margin: 0; height: 100%; background: #111; }
    body.no-gui #potree_sidebar_container,
    body.no-gui .potree_menu_toggle,
    body.no-gui #potree_quick_buttons,
    body.no-gui #potree_description,
    body.no-gui #potree_map_toggle,
    body.no-gui .compass {
      display: none !important;
    }
  </style>
</head>
<body>
  <script src="./libs/jquery/jquery-3.1.1.min.js"></script>
  <script src="./libs/spectrum/spectrum.js"></script>
  <script src="./libs/jquery-ui/jquery-ui.min.js"></script>
  <script src="./libs/other/BinaryHeap.js"></script>
  <script src="./libs/tween/tween.min.js"></script>
  <script src="./libs/d3/d3.js"></script>
  <script src="./libs/proj4/proj4.js"></script>
  <script src="./libs/openlayers3/ol.js"></script>
  <script src="./libs/i18next/i18next.js"></script>
  <script src="./libs/jstree/jstree.js"></script>
  <script src="./libs/potree/potree.js"></script>
  <script src="./libs/plasio/js/laslaz.js"></script>

  <div class="potree_container" style="position:absolute;width:100%;height:100%;left:0;top:0;">
    <div id="potree_render_area"></div>
    <div id="potree_sidebar_container"></div>
  </div>

  <script>
    const UTM18S =
      "+proj=utm +zone=18 +south +datum=WGS84 +units=m +no_defs";
    proj4.defs("EPSG:32718", UTM18S);
    proj4.defs("epsg:32718", UTM18S);

    const params = new URLSearchParams(window.location.search);
    const metadataUrl = params.get("metadata");
    const title = params.get("title") || "point cloud";
    const showGui = params.get("gui") === "1";

    if (!showGui) document.body.classList.add("no-gui");

    window.viewer = new Potree.Viewer(document.getElementById("potree_render_area"));
    viewer.setEDLEnabled(true);
    viewer.setFOV(60);
    viewer.setPointBudget(3_000_000);
    viewer.loadSettingsFromURL();
    viewer.setBackground("gradient");
    viewer.setDescription(showGui ? title : "");

    if (showGui) {
      viewer.loadGUI(() => {
        viewer.setLanguage("en");
        $("#menu_appearance").next().show();
        $("#menu_tools").next().show();
        viewer.toggleSidebar();
      });
    }

    if (!metadataUrl) {
      viewer.setDescription("Missing ?metadata= URL");
    } else {
      Potree.loadPointCloud(metadataUrl, title).then((e) => {
        const pointcloud = e.pointcloud;
        const material = pointcloud.material;
        material.size = 1.2;
        material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
        material.shape = Potree.PointShape.SQUARE;
        material.activeAttributeName = "elevation";
        viewer.scene.addPointCloud(pointcloud);
        viewer.fitToScreen();
      }).catch((err) => {
        console.error("Failed to load point cloud", err);
        viewer.setDescription("Failed to load point cloud");
      });
    }
  </script>
</body>
</html>
